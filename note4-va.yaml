# =============================================================================
# Zectrix Note 4 voice assistant - example thin config.
#
# Copy this next to your secrets.yaml, edit the substitutions, flash it. The
# firmware core, the skins and the two custom components are pulled from GitHub
# at compile time, so this file is the only one you keep. After the core
# changes, run `esphome clean` before rebuilding - otherwise ESPHome reuses its
# cached copy of the package.
#
# UNTESTED ON HARDWARE. See README.md for what that means and docs/HARDWARE.md
# for the bring-up checklist.
#
# Docs: README.md   Pinout: docs/HARDWARE.md
# =============================================================================

substitutions:
  # Changing `name` re-creates every entity in Home Assistant.
  name: note4-va
  friendly_name: "Note 4 Voice"

  # The look the device boots with; switch it live with the "Skin" select in
  # Home Assistant. One of:
  #   paper, swiss, instrument, tiles, poster, dial, pixel, quiet
  # It must be one of the skins listed under `files:` below.
  skin: swiss

  # Shown on the page of the day.
  room: "Kuchnia"

  # Weather now on the page of the day: the state is the condition, the
  # `temperature` attribute the temperature. Today's high / low are optional
  # sensors; leave them on `sensor.none` if you have none.
  weather_entity: weather.forecast_home
  # weather_high_entity: sensor.today_high
  # weather_low_entity: sensor.today_low

  # POSIX timezone for the RTC, so the clock is right after a reboot before
  # Home Assistant connects. Once it does, HA's own timezone is used.
  #   Poland / Central Europe: CET-1CEST,M3.5.0,M10.5.0/3
  #   UK:                      GMT0BST,M3.5.0/1,M10.5.0
  timezone: "CET-1CEST,M3.5.0,M10.5.0/3"

  # Speaker volume clamps (0..1). The Note 4's speaker is small and nobody has
  # measured where it starts to distort; if "100%" does, lower volume_max.
  volume_min: '0.5'
  volume_max: '1.0'

  # The speaker this room has besides the Note 4, if any. Spoken replies can go
  # there instead ("TTS output" select in HA). Leave it alone if the Note 4 is
  # the only speaker - `media_player.none` is not a real entity, and everything
  # quietly stays local. The timer alarm always rings on the device.
  external_media_player_id: media_player.none
  tts_output_default: "This device"

external_components:
  - source: github://MichalZaniewicz/esphome-zectrix-note4-va@main
    components: [zectrix_epd, note4_ui]
    refresh: 0s

packages:
  core:
    url: https://github.com/MichalZaniewicz/esphome-zectrix-note4-va
    ref: main
    files:
      - base/core.yaml
      # Every skin listed here is compiled in and can be picked from Home
      # Assistant. Each one costs flash (fonts and artwork) and build time, so
      # delete the lines of skins you will never use - just keep the one named
      # in `skin:` above.
      - base/skins/paper.yaml
      - base/skins/swiss.yaml
      - base/skins/instrument.yaml
      - base/skins/tiles.yaml
      - base/skins/poster.yaml
      - base/skins/dial.yaml
      - base/skins/pixel.yaml
      - base/skins/quiet.yaml
    refresh: 0s

# Optional: encrypt the native API. Add the key to secrets.yaml as well.
# api:
#   encryption:
#     key: !secret api_encryption_key
