blueprint:
  name: Note 4 - doorbell
  description: >-
    When the doorbell rings, shows a camera snapshot on a Zectrix Note 4 running
    esphome-zectrix-note4-va, with an optional AI caption ("Courier with a
    parcel"). The device fetches the snapshot itself, so it must be able to reach
    Home Assistant at the address below. It goes back to the page of the day
    after a minute.
  domain: automation
  author: Michał Zaniewicz
  source_url: https://github.com/MichalZaniewicz/esphome-zectrix-note4-va/blob/main/blueprints/automation/note4_doorbell.yaml
  homeassistant:
    min_version: "2025.8.0"
  input:
    device_name:
      name: Device name
      description: >-
        The ESPHome `name` of the Note 4 with dashes turned into underscores
        (`note4-va` becomes `note4_va`).
      default: note4_va
      selector:
        text: {}
    bell:
      name: Doorbell
      description: A binary sensor (rings when it turns on) or an event entity (rings on every event).
      selector:
        entity:
          domain: [binary_sensor, event]
    camera:
      name: Camera
      selector:
        entity:
          domain: camera
    place:
      name: Place shown on screen
      default: Gate
      selector:
        text: {}
    ha_url:
      name: Home Assistant address
      description: How the Note 4 reaches Home Assistant on your network. No trailing slash.
      default: http://homeassistant.local:8123
      selector:
        text: {}
    ai_task:
      name: AI Task entity
      description: Writes a few-word caption from the snapshot. Leave empty for no caption.
      default: []
      selector:
        entity:
          domain: ai_task
          multiple: true
    language:
      name: Language
      description: Language of the AI caption.
      default: en
      selector:
        select:
          options:
            - label: English
              value: en
            - label: Polski
              value: pl
            - label: Deutsch
              value: de
            - label: Nederlands
              value: nl
            - label: Français
              value: fr
            - label: Español
              value: es

mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input bell
    not_to:
      - unavailable
      - unknown

conditions:
  - "{{ trigger.to_state.domain == 'event' or trigger.to_state.state == 'on' }}"

variables:
  device_name: !input device_name
  camera: !input camera
  place: !input place
  ha_url: !input ha_url
  ai_task: !input ai_task
  lang: !input language
  language_name: >-
    {{ {'en': 'English', 'pl': 'Polish', 'de': 'German', 'nl': 'Dutch', 'fr': 'French', 'es': 'Spanish'}.get(lang, 'English') }}

actions:
  - variables:
      caption: ""
  - if:
      - "{{ ai_task | length > 0 }}"
    then:
      - action: ai_task.generate_data
        data:
          entity_id: "{{ ai_task[0] }}"
          task_name: Note 4 doorbell caption
          instructions: >-
            Someone rang the doorbell. In {{ language_name }}, describe in at most four
            words who or what is at the door (for example "Courier with a parcel").
            No punctuation at the end, no quotes.
          attachments:
            - media_content_id: "media-source://camera/{{ camera }}"
              media_content_type: image/jpeg
        response_variable: described
        continue_on_error: true
      - variables:
          caption: "{{ (described.data | default('') | string)[:40] | trim if described is defined else '' }}"
  - action: "esphome.{{ device_name }}_doorbell"
    data:
      url: >-
        {{ ha_url }}/api/camera_proxy/{{ camera }}?token={{ state_attr(camera, 'access_token') }}&width=264
      caption: "{{ caption }}"
      place: "{{ place }}"
