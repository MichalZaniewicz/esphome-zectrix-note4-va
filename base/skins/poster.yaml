# Skin "poster": poster geometry. A big black circle with the clock, quarter
# circles as background, black bars, data shown as shapes.
# Archivo Black + Archivo. Fonts are prefixed poster_ so several skins can be
# compiled in.
#
# Text fonts: GF_Latin_Core, which covers every on-screen language (en, pl,
# de, nl, fr, es) and has ” ° · … – — „ « ».
# Big numerals carry only the glyphs they show.
# Rough flash for all fonts below: ~105 KB.

font:
  # ---- Archivo Black: numerals ----
  - id: poster_clock          # idle clock in the circle ("00:00" = 167 px), idle temperature
    file: "gfonts://Archivo Black"
    size: 56
    bpp: 4
    glyphs: ["0123456789:-°"]
  - id: poster_huge           # tomorrow's high
    file: "gfonts://Archivo Black"
    size: 118
    bpp: 4
    glyphs: ["0123456789-°"]
  - id: poster_timer          # timer screen, elapsed seconds while listening
    file: "gfonts://Archivo Black"
    size: 44
    bpp: 4
    glyphs: ["0123456789:"]
  - id: poster_num            # idle timer card, tomorrow's low, doorbell time
    file: "gfonts://Archivo Black"
    size: 30
    bpp: 4
    glyphs: ["0123456789:-°"]
  # ---- Archivo Black: text ----
  - id: poster_head           # question, next event time, headlines
    file: "gfonts://Archivo Black"
    size: 22
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: poster_val            # values inside the shapes
    file: "gfonts://Archivo Black"
    size: 14
    bpp: 4
    glyphsets: [GF_Latin_Core]
  # ---- Archivo ----
  - id: poster_body           # answer text
    file: "gfonts://Archivo@400"
    size: 19
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: poster_bold
    file: "gfonts://Archivo@700"
    size: 13
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: poster_small
    file: "gfonts://Archivo@600"
    size: 12
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: poster_label          # spaced capitals
    file: "gfonts://Archivo@700"
    size: 10
    bpp: 4
    glyphsets: [GF_Latin_Core]

esphome:
  on_boot:
    # After the fonts and the UI object exist, before core.yaml applies the
    # restored "Skin" choice (-500).
    - priority: -50
      then:
        - lambda: |-
            id(ui).add_skin(new note4_ui::PosterSkin(
                id(poster_clock), id(poster_huge), id(poster_timer), id(poster_num),
                id(poster_head), id(poster_val), id(poster_body), id(poster_bold),
                id(poster_small), id(poster_label)));
