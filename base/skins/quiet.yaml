# Skin "quiet": an almost empty screen. One big thing, the rest whispered in
# grey; no frames, no icons, lots of air.
# Instrument Serif + Instrument Sans. Fonts are prefixed quiet_ so several
# skins can be compiled in.
#
# Text fonts: GF_Latin_Core, which covers every on-screen language (en, pl,
# de, nl, fr, es) and has ” ° · … – — „ « ».
# The huge numerals carry only the glyphs they show.
# Rough flash for all fonts below: ~82 KB.

font:
  - id: quiet_huge            # clock ("00:00" = 320 px), timer, tomorrow's high
    file: "gfonts://Instrument Serif"
    size: 156
    bpp: 4
    glyphs: ["0123456789:-°"]
  - id: quiet_body            # answer, card values, heard question
    file: "gfonts://Instrument Serif"
    size: 28
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: quiet_italic          # question, timer name, "Listening" / "I heard"
    file: { type: gfonts, family: Instrument Serif, weight: 400, italic: true }
    size: 26
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: quiet_small           # grey whispers
    file: "gfonts://Instrument Sans@500"
    size: 13
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: quiet_tiny
    file: "gfonts://Instrument Sans@500"
    size: 11
    bpp: 4
    glyphsets: [GF_Latin_Core]

esphome:
  on_boot:
    # After the fonts and the UI object exist, before core.yaml applies the
    # restored "Skin" choice (-500).
    - priority: -50
      then:
        - lambda: |-
            id(ui).add_skin(new note4_ui::QuietSkin(
                id(quiet_huge), id(quiet_body), id(quiet_italic), id(quiet_small),
                id(quiet_tiny)));
