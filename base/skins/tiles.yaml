# Skin "tiles": rounded tiles in a few greys, big friendly Manrope numbers,
# pill buttons. Fonts are prefixed tiles_.
#
# Text fonts: GF_Latin_Kernel plus the Polish letters and „ (Kernel has ” ° · … –).
# Big numerals carry only the glyphs they show.

font:
  - id: tiles_clock
    file: "gfonts://Manrope@800"
    size: 72
    bpp: 4
    glyphs: ["0123456789:"]
  - id: tiles_temp
    file: "gfonts://Manrope@800"
    size: 44
    bpp: 4
    glyphs: ["0123456789°-–"]
  - id: tiles_next
    file: "gfonts://Manrope@800"
    size: 28
    bpp: 4
    glyphs: ["0123456789:°/ -–"]
  - id: tiles_card
    file: "gfonts://Manrope@800"
    size: 32
    bpp: 4
    glyphs: ["0123456789:SłuchamCwil…–"]
  - id: tiles_timer
    file: "gfonts://Manrope@800"
    size: 48
    bpp: 4
    glyphs: ["0123456789:"]
  - id: tiles_fc_hi
    file: "gfonts://Manrope@800"
    size: 60
    bpp: 4
    glyphs: ["0123456789°-–"]
  - id: tiles_fc_lo
    file: "gfonts://Manrope@800"
    size: 22
    bpp: 4
    glyphs: ["0123456789°/ -–"]
  - id: tiles_answer
    file: "gfonts://Manrope@600"
    size: 18
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["ĄąĆćĘęŁłŃńÓóŚśŹźŻż„"]
  - id: tiles_m15
    file: "gfonts://Manrope@800"
    size: 15
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["ĄąĆćĘęŁłŃńÓóŚśŹźŻż„"]
  - id: tiles_m14
    file: "gfonts://Manrope@800"
    size: 14
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["ĄąĆćĘęŁłŃńÓóŚśŹźŻż„"]
  - id: tiles_m14m
    file: "gfonts://Manrope@700"
    size: 14
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["ĄąĆćĘęŁłŃńÓóŚśŹźŻż„"]
  - id: tiles_m13
    file: "gfonts://Manrope@800"
    size: 13
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["ĄąĆćĘęŁłŃńÓóŚśŹźŻż„"]
  - id: tiles_m12
    file: "gfonts://Manrope@800"
    size: 12
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["ĄąĆćĘęŁłŃńÓóŚśŹźŻż„"]
  - id: tiles_m12m
    file: "gfonts://Manrope@700"
    size: 12
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["ĄąĆćĘęŁłŃńÓóŚśŹźŻż„"]
  - id: tiles_m11
    file: "gfonts://Manrope@800"
    size: 11
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["ĄąĆćĘęŁłŃńÓóŚśŹźŻż„"]
  - id: tiles_m11m
