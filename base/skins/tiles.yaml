esphome:
  on_boot:
    # After the fonts and the UI object exist, before core.yaml applies the
    # restored "Skin" choice (-500).
    - priority: -50
      then:
        - lambda: |-
            note4_ui::TilesFonts f;
            f.clock = id(tiles_clock);
            f.temp = id(tiles_temp);
            f.next = id(tiles_next);
            f.card = id(tiles_card);
            f.timer = id(tiles_timer);
            f.fc_hi = id(tiles_fc_hi);
            f.fc_lo = id(tiles_fc_lo);
            f.answer = id(tiles_answer);
            f.m15 = id(tiles_m15);
            f.m14 = id(tiles_m14);
            f.m14m = id(tiles_m14m);
            f.m13 = id(tiles_m13);
            f.m12 = id(tiles_m12);
            f.m12m = id(tiles_m12m);
            f.m11 = id(tiles_m11);
            f.m11m = id(tiles_m11m);
            f.m10 = id(tiles_m10);
            id(ui).add_skin(new note4_ui::TilesSkin(f));
