# Skin "kafelki": rounded tiles in a few greys, big friendly Manrope numbers,
# pill buttons. Fonts are prefixed kafelki_.
#
# Text fonts: GF_Latin_Kernel plus the Polish letters and „ (Kernel has ” ° · … –).
# Big numerals carry only the glyphs they show.

font:
  - id: kafelki_clock
    file: "gfonts://Manrope@800"
    size: 72
    bpp: 4
    glyphs: ["0123456789:"]
  - id: kafelki_temp
    file: "gfonts://Manrope@800"
    size: 44
    bpp: 4
    glyphs: ["0123456789°-–"]
  - id: kafelki_next
    file: "gfonts://Manrope@800"
    size: 28
    bpp: 4
    glyphs: ["0123456789:°/ -–"]
  - id: kafelki_card
    file: "gfonts://Manrope@800"
    size: 32
    bpp: 4
    glyphs: ["0123456789:SłuchamCwil…–"]
  - id: kafelki_timer
    file: "gfonts://Manrope@800"
    size: 48
    bpp: 4
    glyphs: ["0123456789:"]
  - id: kafelki_fc_hi
    file: "gfonts://Manrope@800"
    size: 60
    bpp: 4
    glyphs: ["0123456789°-–"]
  - id: kafelki_fc_lo
    file: "gfonts://Manrope@800"
    size: 22
    bpp: 4
    glyphs: ["0123456789°/ -–"]
  - id: kafelki_answer
    file: "gfonts://Manrope@600"
    size: 18
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["ĄąĆćĘęŁłŃńÓóŚśŹźŻż„"]
  - id: kafelki_m15
    file: "gfonts://Manrope@800"
    size: 15
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["ĄąĆćĘęŁłŃńÓóŚśŹźŻż„"]
  - id: kafelki_m14
    file: "gfonts://Manrope@800"
    size: 14
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["ĄąĆćĘęŁłŃńÓóŚśŹźŻż„"]
  - id: kafelki_m14m
    file: "gfonts://Manrope@700"
    size: 14
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["ĄąĆćĘęŁłŃńÓóŚśŹźŻż„"]
  - id: kafelki_m13
    file: "gfonts://Manrope@800"
    size: 13
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["ĄąĆćĘęŁłŃńÓóŚśŹźŻż„"]
  - id: kafelki_m12
    file: "gfonts://Manrope@800"
    size: 12
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["ĄąĆćĘęŁłŃńÓóŚśŹźŻż„"]
  - id: kafelki_m12m
    file: "gfonts://Manrope@700"
    size: 12
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["ĄąĆćĘęŁłŃńÓóŚśŹźŻż„"]
  - id: kafelki_m11
    file: "gfonts://Manrope@800"
    size: 11
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["ĄąĆćĘęŁłŃńÓóŚśŹźŻż„"]
  - id: kafelki_m11m
    file: "gfonts://Manrope@700"
    size: 11
