esphome:
  on_boot:
    # After the fonts and the UI object exist, before core.yaml applies the
    # restored "Skórka" choice (-500).
    - priority: -50
      then:
        - lambda: |-
            note4_ui::KafelkiFonts f;
            f.clock = id(kafelki_clock);
            f.temp = id(kafelki_temp);
            f.next = id(kafelki_next);
            f.card = id(kafelki_card);
            f.timer = id(kafelki_timer);
            f.fc_hi = id(kafelki_fc_hi);
            f.fc_lo = id(kafelki_fc_lo);
            f.answer = id(kafelki_answer);
            f.m15 = id(kafelki_m15);
            f.m14 = id(kafelki_m14);
            f.m14m = id(kafelki_m14m);
            f.m13 = id(kafelki_m13);
            f.m12 = id(kafelki_m12);
            f.m12m = id(kafelki_m12m);
            f.m11 = id(kafelki_m11);
            f.m11m = id(kafelki_m11m);
            f.m10 = id(kafelki_m10);
            id(ui).add_skin(new note4_ui::KafelkiSkin(f));
