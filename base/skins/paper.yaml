# Skin "paper": Literata + Atkinson Hyperlegible, thin frames, warm and
# editorial. Fonts are prefixed paper_ so several skins can be compiled in.
#
# Text fonts: GF_Latin_Core, which covers every on-screen language (en, pl,
# de, nl, fr, es) and has ” ° · … – „ « ».
# Big numerals carry only the glyphs they show.

font:
  # ---- Literata ----
  - id: paper_clock
    file: "gfonts://Literata@700"
    # "00:00" (the widest) fits the 236 px the mockup allows
    size: 84
    bpp: 4
    glyphs: ["0123456789:"]
  - id: paper_date
    file: { type: gfonts, family: Literata, weight: 400, italic: true }
    size: 17
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: paper_temp
    file: "gfonts://Literata@600"
    size: 30
    bpp: 4
    glyphs: ["0123456789°-–"]
  - id: paper_next
    file: "gfonts://Literata@700"
    size: 24
    bpp: 4
    glyphs: ["0123456789:–"]
  - id: paper_brief
    file: { type: gfonts, family: Literata, weight: 400, italic: true }
    size: 13
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: paper_card
    file: "gfonts://Literata@700"
    size: 28
    bpp: 4
    glyphs: ["0123456789:°/ -–"]
  - id: paper_title
    file: "gfonts://Literata@600"
    size: 16
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: paper_question
    file: { type: gfonts, family: Literata, weight: 400, italic: true }
    size: 19
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: paper_answer
    file: "gfonts://Literata@400"
    size: 22
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: paper_fc_hi
    file: "gfonts://Literata@700"
    size: 58
    bpp: 4
    glyphs: ["0123456789°-–"]
  - id: paper_fc_lo
    file: "gfonts://Literata@400"
    size: 26
    bpp: 4
    glyphs: ["0123456789°/ -–"]
  - id: paper_timer
    file: "gfonts://Literata@700"
    size: 48
    bpp: 4
    glyphs: ["0123456789:"]
  - id: paper_times
    file: "gfonts://Literata@600"
    size: 22
    bpp: 4
    glyphs: ["0123456789:–"]
  - id: paper_big
    file: { type: gfonts, family: Literata, weight: 500, italic: true }
    size: 50
    bpp: 4
    # the Listening / Thinking… word, every language in strings.cpp
    glyphs: ["ListengThk…SłucamCwlI örMojJ'éUEPd"]
  - id: paper_bell_time
    file: "gfonts://Literata@700"
    size: 34
    bpp: 4
    glyphs: ["0123456789:–"]
  - id: paper_caption
    file: "gfonts://Literata@600"
    size: 21
    bpp: 4
    glyphsets: [GF_Latin_Core]
  # ---- Atkinson Hyperlegible ----
  - id: paper_l9b
    file: "gfonts://Atkinson Hyperlegible@700"
    size: 9
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: paper_l10b
    file: "gfonts://Atkinson Hyperlegible@700"
    size: 10
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: paper_l10i
    file: { type: gfonts, family: Atkinson Hyperlegible, weight: 400, italic: true }
    size: 10
    bpp: 4
    # the AI caption note, every language in strings.cpp
    glyphs: [" AIphotcainszedjęK-Brbugvléó…"]
  - id: paper_l11
    file: "gfonts://Atkinson Hyperlegible@400"
    size: 11
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: paper_l11i
    file: { type: gfonts, family: Atkinson Hyperlegible, weight: 400, italic: true }
    size: 11
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: paper_l11b
    file: "gfonts://Atkinson Hyperlegible@700"
    size: 11
    bpp: 4
    glyphs: ["0123456789°-–"]
  - id: paper_l12
    file: "gfonts://Atkinson Hyperlegible@400"
    size: 12
    bpp: 4
    # timer total ("of 10:00", "z 10:00", "von 10:00", ...)
    glyphs: [" 0123456789:ofzvnasurde"]
  - id: paper_l12b
    file: "gfonts://Atkinson Hyperlegible@700"
    size: 12
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: paper_l13
    file: "gfonts://Atkinson Hyperlegible@400"
    size: 13
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: paper_l13b
    file: "gfonts://Atkinson Hyperlegible@700"
    size: 13
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: paper_l14b
    file: "gfonts://Atkinson Hyperlegible@700"
    size: 14
    bpp: 4
    glyphsets: [GF_Latin_Core]

esphome:
  on_boot:
    # After the fonts and the UI object exist, before core.yaml applies the
    # restored "Skin" choice (-500).
    - priority: -50
      then:
        - lambda: |-
            note4_ui::PaperFonts f;
            f.clock = id(paper_clock);
            f.date = id(paper_date);
            f.temp = id(paper_temp);
            f.next = id(paper_next);
            f.brief = id(paper_brief);
            f.card = id(paper_card);
            f.title = id(paper_title);
            f.question = id(paper_question);
            f.answer = id(paper_answer);
            f.fc_hi = id(paper_fc_hi);
            f.fc_lo = id(paper_fc_lo);
            f.timer = id(paper_timer);
            f.times = id(paper_times);
            f.big = id(paper_big);
            f.bell_time = id(paper_bell_time);
            f.caption = id(paper_caption);
            f.l9b = id(paper_l9b);
            f.l10b = id(paper_l10b);
            f.l10i = id(paper_l10i);
            f.l11 = id(paper_l11);
            f.l11i = id(paper_l11i);
            f.l11b = id(paper_l11b);
            f.l12 = id(paper_l12);
            f.l12b = id(paper_l12b);
            f.l13 = id(paper_l13);
            f.l13b = id(paper_l13b);
            f.l14b = id(paper_l14b);
            id(ui).add_skin(new note4_ui::PaperSkin(f));
