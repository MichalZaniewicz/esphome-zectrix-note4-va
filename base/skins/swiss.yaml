# Skin "swiss": strict grid, huge Inter Tight numerals, thick rules and
# one black block per screen. Fonts are prefixed swiss_.
#
# Text fonts: GF_Latin_Core, which covers every on-screen language (en, pl,
# de, nl, fr, es) and has ” ° · … – „ « ».
# Big numerals carry only the glyphs they show.

font:
  # ---- Inter Tight ----
  - id: swiss_clock
    file: "gfonts://Inter Tight@800"
    size: 122
    bpp: 4
    glyphs: ["0123456789:"]
  - id: swiss_next
    file: "gfonts://Inter Tight@700"
    size: 32
    bpp: 4
    glyphs: ["0123456789:–"]
  - id: swiss_title
    file: "gfonts://Inter Tight@800"
    size: 28
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: swiss_card
    file: "gfonts://Inter Tight@800"
    size: 34
    bpp: 4
    glyphs: ["0123456789:°/ -–"]
  - id: swiss_question
    file: "gfonts://Inter Tight@700"
    size: 21
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: swiss_fact
    file: "gfonts://Inter Tight@800"
    size: 30
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: swiss_fc_hi
    file: "gfonts://Inter Tight@800"
    size: 104
    bpp: 4
    glyphs: ["0123456789°-–"]
  - id: swiss_fc_lo
    file: "gfonts://Inter Tight@700"
    size: 38
    bpp: 4
    glyphs: ["0123456789°-–"]
  - id: swiss_h26
    file: "gfonts://Inter Tight@800"
    size: 26
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: swiss_end
    file: "gfonts://Inter Tight@800"
    size: 24
    bpp: 4
    glyphs: ["0123456789:–"]
  - id: swiss_big
    file: "gfonts://Inter Tight@800"
    size: 56
    bpp: 4
    # the Listening / Thinking… word, every language in strings.cpp
    glyphs: ["ListengThk…SłucamCwlI örMojJ'éUEPd"]
  # ---- Inter ----
  - id: swiss_i9b
    file: "gfonts://Inter@700"
    size: 9
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: swiss_i10b
    file: "gfonts://Inter@700"
    size: 10
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: swiss_i10s
    file: "gfonts://Inter@600"
    size: 10
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: swiss_i11b
    file: "gfonts://Inter@700"
    size: 11
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: swiss_i11s
    file: "gfonts://Inter@600"
    size: 11
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: swiss_i12
    file: "gfonts://Inter@400"
    size: 12
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: swiss_i12s
    file: "gfonts://Inter@600"
    size: 12
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: swiss_i12b
    file: "gfonts://Inter@700"
    size: 12
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: swiss_i13s
    file: "gfonts://Inter@600"
    size: 13
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: swiss_i14b
    file: "gfonts://Inter@700"
    size: 14
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: swiss_i15s
    file: "gfonts://Inter@600"
    size: 15
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: swiss_i19
    file: "gfonts://Inter@400"
    size: 19
    bpp: 4
    glyphsets: [GF_Latin_Core]

esphome:
  on_boot:
    # After the fonts and the UI object exist, before core.yaml applies the
    # restored "Skin" choice (-500).
    - priority: -50
      then:
        - lambda: |-
            note4_ui::SwissFonts f;
            f.clock = id(swiss_clock);
            f.next = id(swiss_next);
            f.title = id(swiss_title);
            f.card = id(swiss_card);
            f.question = id(swiss_question);
            f.fact = id(swiss_fact);
            f.fc_hi = id(swiss_fc_hi);
            f.fc_lo = id(swiss_fc_lo);
            f.h26 = id(swiss_h26);
            f.end = id(swiss_end);
            f.big = id(swiss_big);
            f.i9b = id(swiss_i9b);
            f.i10b = id(swiss_i10b);
            f.i10s = id(swiss_i10s);
            f.i11b = id(swiss_i11b);
            f.i11s = id(swiss_i11s);
            f.i12 = id(swiss_i12);
            f.i12s = id(swiss_i12s);
            f.i12b = id(swiss_i12b);
            f.i13s = id(swiss_i13s);
            f.i14b = id(swiss_i14b);
            f.i15s = id(swiss_i15s);
            f.i19 = id(swiss_i19);
            id(ui).add_skin(new note4_ui::SwissSkin(f));
