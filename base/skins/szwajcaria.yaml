esphome:
  on_boot:
    # After the fonts and the UI object exist, before core.yaml applies the
    # restored "Skórka" choice (-500).
    - priority: -50
      then:
        - lambda: |-
            note4_ui::SzwajcariaFonts f;
            f.clock = id(szwajcaria_clock);
            f.next = id(szwajcaria_next);
            f.title = id(szwajcaria_title);
            f.card = id(szwajcaria_card);
            f.question = id(szwajcaria_question);
            f.fact = id(szwajcaria_fact);
            f.fc_hi = id(szwajcaria_fc_hi);
            f.fc_lo = id(szwajcaria_fc_lo);
            f.h26 = id(szwajcaria_h26);
            f.end = id(szwajcaria_end);
            f.big = id(szwajcaria_big);
            f.i9b = id(szwajcaria_i9b);
            f.i10b = id(szwajcaria_i10b);
            f.i10s = id(szwajcaria_i10s);
            f.i11b = id(szwajcaria_i11b);
            f.i11s = id(szwajcaria_i11s);
            f.i12 = id(szwajcaria_i12);
            f.i12s = id(szwajcaria_i12s);
            f.i12b = id(szwajcaria_i12b);
            f.i13s = id(szwajcaria_i13s);
            f.i14b = id(szwajcaria_i14b);
            f.i15s = id(szwajcaria_i15s);
            f.i19 = id(szwajcaria_i19);
            id(ui).add_skin(new note4_ui::SzwajcariaSkin(f));
