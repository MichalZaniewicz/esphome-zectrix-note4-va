# Skin "szwajcaria": strict grid, huge Inter Tight numerals, thick rules and
# one black block per screen. Fonts are prefixed szwajcaria_.
#
# Text fonts: GF_Latin_Kernel plus the Polish letters and „ (Kernel has ” ° · … –).
# Big numerals carry only the glyphs they show.

font:
  # ---- Inter Tight ----
  - id: szwajcaria_clock
    file: "gfonts://Inter Tight@800"
    size: 122
    bpp: 4
    glyphs: ["0123456789:"]
  - id: szwajcaria_next
    file: "gfonts://Inter Tight@700"
    size: 32
    bpp: 4
    glyphs: ["0123456789:–"]
  - id: szwajcaria_title
    file: "gfonts://Inter Tight@800"
    size: 28
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["ĄąĆćĘęŁłŃńÓóŚśŹźŻż„"]
  - id: szwajcaria_card
    file: "gfonts://Inter Tight@800"
    size: 34
    bpp: 4
    glyphs: ["0123456789:°/ -–"]
  - id: szwajcaria_question
    file: "gfonts://Inter Tight@700"
    size: 21
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["ĄąĆćĘęŁłŃńÓóŚśŹźŻż„"]
  - id: szwajcaria_fact
    file: "gfonts://Inter Tight@800"
    size: 30
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["ĄąĆćĘęŁłŃńÓóŚśŹźŻż„"]
  - id: szwajcaria_fc_hi
    file: "gfonts://Inter Tight@800"
    size: 104
    bpp: 4
    glyphs: ["0123456789°-–"]
  - id: szwajcaria_fc_lo
    file: "gfonts://Inter Tight@700"
    size: 38
    bpp: 4
    glyphs: ["0123456789°-–"]
  - id: szwajcaria_h26
    file: "gfonts://Inter Tight@800"
    size: 26
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["ĄąĆćĘęŁłŃńÓóŚśŹźŻż„"]
  - id: szwajcaria_end
    file: "gfonts://Inter Tight@800"
    size: 24
    bpp: 4
    glyphs: ["0123456789:–"]
  - id: szwajcaria_big
    file: "gfonts://Inter Tight@800"
    size: 56
    bpp: 4
    glyphs: ["SłuchamCwil…"]
  # ---- Inter ----
